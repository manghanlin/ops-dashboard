version: '3.9'

services:

  # ── 反向代理 + 靜態前端 ──────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"        # 之後加 SSL 時改成 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard.html:/usr/share/nginx/html/dashboard.html:ro
    depends_on:
      - api
    restart: unless-stopped

  # ── FastAPI 後端 ─────────────────────────────────────────
  api:
    build: ./backend
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    # 不對外暴露 8000，只讓 nginx 內網存取

  # ── Redis 快取 ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASS}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    # 不對外暴露 port，只讓 api 內網存取

volumes:
  redis_data:
